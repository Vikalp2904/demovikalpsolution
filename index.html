<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VIKALP — Healthcare, ERP and enterprise software solutions.">
    <meta name="keywords" content="VIKALP, Hospital ERP, OPD Software, Healthcare Software, Enterprise Software">
    <title>VIKALP — Something Powerful Is Coming</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    :root {
        --bg: #07070a;
        --text: #ffffff;
        --muted: #a1a1aa;
        --border: rgba(255,255,255,0.12);
        --accent: #8b5cf6;
        --accent-light: #a78bfa;
        --accent-2: #ec4899;
        --success: #4ade80;
    }
    html,
    body {
        min-height: 100%;
    }
    body {
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow-x: hidden;
    }
    .background {
        position: fixed;
        inset: 0;
        overflow: hidden;
        z-index: -1;
        background: radial-gradient( circle at 50% 35%, rgba(139, 92, 246, 0.14), transparent 36% ),#07070a;
    }
    .grid {
        position: absolute;
        inset: 0;
        background-image: linear-gradient( rgba(255,255,255,0.025) 1px, transparent 1px ), linear-gradient( 90deg, rgba(255,255,255,0.025) 1px, transparent 1px );
        background-size: 50px 50px;
        mask-image: linear-gradient( to bottom, transparent, black 20%, black 80%, transparent );
    }
    .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(110px);
        opacity: 0.28;
        animation: float 12s ease-in-out infinite;
    }
    .orb-1 {
        width: 380px;
        height: 380px;
        background: #7c3aed;
        top: -160px;
        left: -100px;
    }
    .orb-2 {
        width: 320px;
        height: 320px;
        background: #db2777;
        right: -120px;
        bottom: -120px;
        animation-delay: -6s;
    }
    @keyframes float {

        0%, 100% {
            transform: translate(0,0);
        }

        50% {
            transform: translate(35px,-30px);
        }
    }
    .container {
        width: min(1120px, 92%);
        min-height: 100vh;
        margin: auto;
        display: flex;
        flex-direction: column;
    }
    .header {
        padding: 34px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .logo {
        color: white;
        text-decoration: none;
        font-size: 21px;
        font-weight: 800;
        letter-spacing: 5px;
    }
    .status {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #71717a;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
    }
    .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 0 5px rgba(74,222,128,0.08);
    }
    .hero {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 65px 0 80px;
    }
    .badge {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 9px 16px;
        border: 1px solid var(--border);
        border-radius: 50px;
        background: rgba(255,255,255,0.04);
        color: #d4d4d8;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 28px;
        backdrop-filter: blur(12px);
    }
    .pulse {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent-light);
        box-shadow: 0 0 0 5px rgba(139,92,246,0.12);
        animation: pulse 2s infinite;
    }
    @keyframes pulse {
        50% {
            box-shadow: 0 0 0 10px rgba(139,92,246,0);
        }
    }
    h1 {
        max-width: 950px;
        font-size: clamp( 45px, 7vw, 88px );
        line-height: 0.98;
        letter-spacing: -4px;
        font-weight: 800;
    }
        h1 span {
            background: linear-gradient( 100deg, #a78bfa, #ec4899 );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
    .countdown {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        margin-bottom: 40px;
    }
    .time-box {
        min-width: 80px;
    }
        .time-box strong {
            display: block;
            font-size: 34px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .time-box small {
            display: block;
            margin-top: 5px;
            color: #71717a;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
    .separator {
        color: #52525b;
        font-size: 25px;
        margin-top: -18px;
    }
    .subscribe-form {
        width: min(540px, 100%);
        display: flex;
        padding: 5px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(15px);
        transition: border-color .3s ease;
    }
        .subscribe-form:focus-within {
            border-color: rgba(139,92,246,0.6);
        }
        .subscribe-form input {
            flex: 1;
            min-width: 0;
            padding: 15px 17px;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            font: inherit;
        }
            .subscribe-form input::placeholder {
                color: #71717a;
            }
        .subscribe-form button {
            border: none;
            border-radius: 10px;
            padding: 0 22px;
            background: white;
            color: #09090b;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: transform .2s ease, background .2s ease;
        }
            .subscribe-form button:hover {
                transform: translateY(-1px);
                background: #e4e4e7;
            }
            .subscribe-form button span {
                margin-left: 8px;
            }
    .form-message {
        min-height: 20px;
        margin-top: 14px;
        color: var(--accent-light);
        font-size: 13px;
    }
    .note {
        margin-top: 8px;
        color: #52525b;
        font-size: 12px;
    }
    footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 28px 0;
        border-top: 1px solid rgba(255,255,255,0.07);
        color: #52525b;
        font-size: 12px;
    }
    .contact {
        display: flex;
        align-items: center;
        gap: 15px;
        flex-wrap: wrap;
    }
        .contact a {
            color: #71717a;
            text-decoration: none;
            transition: color .2s ease;
        }
            .contact a:hover {
                color: white;
            }
    @media (max-width: 600px) {
        .header {
            padding: 25px 0;
        }
        .status {
            display: none;
        }
        .hero {
            padding: 45px 0 55px;
        }
        h1 {
            letter-spacing: -2.5px;
        }
        .countdown {
            gap: 7px;
            margin-bottom: 32px;
        }
        .time-box {
            min-width: 58px;
        }
            .time-box strong {
                font-size: 25px;
            }
            .time-box small {
                font-size: 9px;
                letter-spacing: 1px;
            }
        .separator {
            font-size: 18px;
        }
        .subscribe-form {
            flex-direction: column;
            gap: 6px;
            padding: 6px;
        }
            .subscribe-form input {
                padding: 15px;
            }
            .subscribe-form button {
                min-height: 48px;
            }
        footer {
            flex-direction: column;
            gap: 15px;
            text-align: center;
        }
        .contact {
            justify-content: center;
        }
    }
    </style>
</head>
<body>
    <div class="background">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="grid"></div>
    </div>
    <main class="container">
        <header class="header">
            <a href="https://vikalpsolution.co.in/"
               class="logo">
                VIKALP
            </a>
            <div class="status">
                <span class="status-dot"></span>
                Building Enterprise Systems
            </div>
        </header>
        <section class="hero">
            <div class="badge">
                <span class="pulse"></span>
                Something New Is Coming
            </div>
            <h1>
                Software Built For
                <br>
                <span>Real Operations.</span>
            </h1>
            <div class="countdown">
                <div class="time-box">
                    <strong id="days">
                        00
                    </strong>
                    <small>
                        Days
                    </small>
                </div>
                <span class="separator">
                    :
                </span>
                <div class="time-box">
                    <strong id="hours">
                        00
                    </strong>
                    <small>
                        Hours
                    </small>
                </div>
                <span class="separator">
                    :
                </span>
                <div class="time-box">
                    <strong id="minutes">
                        00
                    </strong>
                    <small>
                        Minutes
                    </small>
                </div>
                <span class="separator">
                    :
                </span>
                <div class="time-box">
                    <strong id="seconds">
                        00
                    </strong>
                    <small>
                        Seconds
                    </small>
                </div>
            </div>
            <form
                class="subscribe-form"
                id="subscribeForm"
                novalidate
            >
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >
                <button type="submit">
                    Notify Me
                    <span>
                        →
                    </span>
                </button>
            </form>
            <p
                class="form-message"
                id="formMessage"
                aria-live="polite"
            ></p>
            <p class="note">
                No spam. Just one email when we launch. ✨
            </p>
        </section>
        <footer>
            <p>
                © 2026 VIKALP — Built with passion & precision.
            </p>
            <div class="contact">
                <a href="mailto:noreply.vikalp@gmail.com">
                    noreply.vikalp@gmail.com
                </a>
                <a href="tel:+917359261780">
                    +91 7359 26 17 80
                </a>
            </div>
        </footer>
    </main>
    <script>
        const launchDate = new Date("2026-12-31T23:59:59+05:30").getTime();
        function updateCountdown() {
            const now = new Date().getTime();
            const distance = launchDate - now;
            if (distance <= 0) {
                document.getElementById("days").textContent = "00";
                document.getElementById("hours").textContent = "00";
                document.getElementById("minutes").textContent = "00";
                document.getElementById("seconds").textContent = "00";
                return;
            }
            const days = Math.floor(distance /(1000 * 60 * 60 * 24));
            const hours = Math.floor((distance /(1000 * 60 * 60)) % 24);
            const minutes = Math.floor((distance /(1000 * 60)) % 60);
            const seconds = Math.floor((distance / 1000) % 60);
            document.getElementById("days").textContent = String(days).padStart(2, "0");
            document.getElementById("hours").textContent = String(hours).padStart(2, "0");
            document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
            document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
        }
        updateCountdown();
        setInterval(updateCountdown,1000);
        const form = document.getElementById("subscribeForm");
        const email = document.getElementById("email");
        const message = document.getElementById("formMessage");
        form.addEventListener("submit",
            function(event) {
                event.preventDefault();
                const emailValue = email.value.trim();
                if (!emailValue) {
                    message.textContent =
                        "Please enter your email address.";
                    return;
                }
                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailPattern.test(emailValue)) {
                    message.textContent = "Please enter a valid email address.";
                    return;
                }
                message.textContent = "Thanks! We'll notify you when VIKALP launches. 🚀";
                email.value = "";
            }
        );
    </script>
</body>
</html>
